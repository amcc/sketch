<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://q5js.org/q5.js"></script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/p5.js"></script> -->
    <link rel="stylesheet" type="text/css" href="style.css" />
    <meta charset="utf-8" />
    <link
      href="https://fonts.gstatic.com/s/archivoblack/v21/HTxqL289NzCGg4MzN6KJ7eW6CYyF_jzx13E.woff2"
      rel="preload"
      as="font"
      crossorigin
    />
  </head>
  <body>
    <main>
      <div id="framerate">framerate</div>
      <p>2025 web identity - click to see 45s</p>
      <div class="control">
        <div class="input-group">
          <label for="num">Grid Size: <span id="grid-value">45</span></label>
          <input type="range" id="grid-size" value="45" min="2" max="100" />
        </div>
        <div class="input-group">
          <label for="num"
            >Square margin: <span id="margin-value">0</span></label
          >
          <input type="range" id="square-margin" value="0" min="1" max="4" />
        </div>

        <div class="input-group">
          <label for="num"
            >Grid thickness: <span id="grid-thickness-value">0</span></label
          >
          <input type="range" id="grid-thickness" value="0" min="0" max="100" />
        </div>

        <!--  tickbox -->
        <label for="tickbox">Grid Green</label>
        <input type="checkbox" id="grid-tick" />
      </div>
      <div id="canvas-container"></div>
    </main>

      <div id="controls">
        <div class="control">
          <label for="num">Square margin</label>
          <input type="range" id="square-margin" value="0" min="1" max="10" />
        </div>
    </aside> -->
  </body>
  <script src="sketch.js"></script>
</html>
